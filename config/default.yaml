# =============================================================
# UAV_yolo 預設設定（請勿直接改這份）
# 使用者修改一律存到 config/local.yaml（UI 設定頁會自動寫入），
# 讀取時 local.yaml 會覆蓋 default.yaml 的同名欄位。
# =============================================================

system:
  mode: sim             # sim=模擬（無硬體，安全預設）| live=實機。用 UI 設定頁切換＋重啟引擎
  web_host: 127.0.0.1
  web_port: 8610
  # 任務記錄：每次「啟用導引」自動開一份 JSONL（指令/ACK/狀態快照/閘門），
  # 關閉導引或引擎停止時收尾。覆盤「那趟為什麼沒追」全靠它。
  mission_log_dir: data/missions
  # 任務錄影：導引啟用時把「疊了偵測框的畫面」錄成與 JSONL 同名的 .mp4。
  # JSONL 記得到座標與閘門，記不到「那個框是車還是草」——覆盤時那才是關鍵。
  mission_video: true
  # （camera.height_source 見 camera 區段）
  mission_video_scale: 0.5   # 相對來源解析度（1920x1080 → 960x540）
  mission_video_fps: 15.0    # 抽幀寫入，別把磁碟寫爆
  # 只保留最近幾部影片（0=不刪）。實測一個下午 13 趟就 414MB，而 JSONL 才 1.5MB。
  mission_video_keep: 12

vehicle:
  airframe: multirotor  # multirotor=旋翼機 | fixedwing=固定翼
  firmware: px4         # 目前僅支援 px4（兩台載具都是）

video:
  source: uvc           # uvc=HDMI採集卡/USB相機直開 | obs=OBS虛擬相機 | rtsp=IP串流 | file=影片檔
  uvc_name_hint: ""     # 用裝置名稱鎖定（例 "USB Video"），空字串則用 uvc_index
  uvc_index: 1
  obs_name_hint: "OBS Virtual Camera"
  rtsp_url: "rtsp://192.168.144.25:8554/main"
  rtsp_transport: auto  # auto=先試 UDP 不通再退 TCP（建議）| udp=最低延遲 | tcp=網路擋 UDP 時
  rtsp_backend: auto    # auto=有 GStreamer 就用（延遲更低），否則 FFMPEG | ffmpeg | gstreamer
  stall_timeout_s: 4.0  # 影像「不報錯但停更」超過這秒數就強制重連（RTSP 常見故障）
  rtsp_timeout_s: 5.0   # RTSP 連線/讀取逾時；不設的話連不到的位址會讓程式卡死
  fourcc: MJPG          # 採集卡像素格式：MJPG 讓 USB2 卡吃得下 1080p30；
                        # 留空=用裝置預設（USB3 卡可留空走 YUY2，免解碼）
  file_path: ""
  # 設成採集卡實際輸出的解析度（Walksnail Avatar VRX 走 HDMI 是 1080p60）。
  # 若實際幀與此不符，系統會自動把內參縮放對齊實際幀，不會算錯。
  width: 1920
  height: 1080
  # 影像鏈路固定延遲（ms）：從「鏡頭曝光」到「這台電腦拿到該幀」。
  # 系統會用 (到達時刻 − 此值) 去取當時的姿態/位置做測地，未補償會有
  # 「延遲 × 飛行速度」的系統性偏移（20m/s × 300ms = 6m）。
  # 量法：鏡頭對著手機碼錶，比較畫面顯示時間與電腦時間的差。
  # 參考值：類比 FPV＋採集卡 ~50-150；數位圖傳/RTSP ~150-400（實測為準）。
  latency_ms: 0

camera:
  # 校正結果檔（UI 校正頁產生）。檔案不存在時退回用 fallback_hfov_deg 近似
  intrinsics_file: config/camera_intrinsics.yaml
  fallback_hfov_deg: 120.0
  # 測地要用的「離地高度」來源：
  #   auto       = 有可用的測距儀就用它，否則退回 rel_alt（建議）
  #   home       = 一律用 rel_alt（相對 home 高度）＝舊行為
  #   rangefinder= 只用測距儀，拿不到就不發指令（最嚴格）
  # 為什麼預設 auto：平地假設需要的是「離目標所在地面的高度」，而 rel_alt 是
  # 「相對 home」。home 基準一偏，測地距離就整體差 h/(h+Δ) 倍（3m 高偏 3m ＝
  # 50% 誤差）；實機更遇過 rel_alt 回報負值導致整趟零指令。測距儀直接量離地
  # 高度，不受 home 影響。傾角 >20° 或超出量程時自動退回 rel_alt。
  height_source: auto

gimbal:
  present: true         # 有沒有裝雲台（C-20T 三軸）
  control: roi          # roi=發ROI座標由飛控指向(建議) | pitchyaw=直接下角度 | none=固定安裝不控
  stabilized: true      # 三軸自穩雲台：相機姿態≈指令角（地理座標系），測地不用機體 roll/pitch
  # auto        = 優先雲台回報 → 其次指令角 → 最後固定安裝
  # feedback    = 只用雲台回報（要求雲台實作 MAVLink 雲台協定 v2）
  # commanded   = 用我們下的指令角
  # fixed_earth = 雲台鎖定在「相對地面固定的角度」，如天底鎖定（LOOK-DOWN）
  #
  # ★ 不回報角度的自穩雲台（如 XF C-20T / CADDX GM3）請用 fixed_earth：
  #   相機朝向完全已知，不需要任何回報。此時 mount_deg 的 pitch/roll 解讀為
  #   **相對地面**（pitch -90 = 垂直朝下），yaw 解讀為「相對機頭的安裝偏移」，
  #   實際偏航 = 機身航向 + 此偏移（C-20T 所有已記載模式的 yaw 都跟隨機身）。
  #
  # ⚠ 用 fixed_earth 就等於向系統保證「雲台真的鎖在那個角度」。若雲台其實在
  #   FPV/PitchLock 模式（會跟隨機身），誤差 = 機身傾角，而且
  #   **懸停時看不出來**（傾角僅 0~3°、誤差幾公分），一開始平移傾 15° 就是
  #   4m 高差 1.1m、15m 高差 4m。務必做動態驗證：鏡頭對準地面標的，
  #   快速平移讓機身傾 10~20°，算出的目標座標不該移動。
  attitude_source: auto
  # 無雲台（control: none）時相機相對機體的安裝角，度。pitch -90 = 垂直朝下
  mount_deg: { roll: 0.0, pitch: -90.0, yaw: 0.0 }
  roi_update_min_m: 2.0   # 目標估計位置移動超過此距離才重發 ROI（省數傳頻寬）

detector:
  # 偵測模型。⚠ 各模型只認自己訓練過的目標——實測：只用玩具車微調的模型
  # 對真實空拍車輛的偵測數從 44 掉到 0（完全遺忘）。換場景務必在設定頁換模型。
  #   weights/toycar.pt      室內玩具車（自訓；200 張、imgsz 960）
  #   weights/toycar_v1_640.pt 同上的前一版（67 張、imgsz 640），留著對照用
  #   weights/best.pt        空拍真車（自訓）
  #   weights/yolo26n.pt     COCO 通用 80 類（含真實汽車/卡車/行人）
  #   weights/yolo11s.pt     COCO 通用 small，較準較慢
  #
  # 選 .onnx 檔＝走 ONNX Runtime + DirectML，用 AMD/Intel GPU 推論。
  # 本機實測（Radeon RX 7700S、toycar 模型 @960、100 幀、無其他負載）：
  #   PyTorch CPU 71.2ms/幀（14 FPS） → ONNX DirectML 12.4ms/幀（80 FPS），5.7x
  # 且兩條路徑逐框一致（120 幀框數全同、座標偏差 <0.1px）。
  # 迴圈速率直接決定追蹤品質：太慢時目標在兩個處理幀之間跑太遠會關聯不上。
  # 匯出（換了 .pt 就要重匯出；imgsz 要對齊該模型的訓練尺寸）：
  #   set ULTRALYTICS_SKIP_REQUIREMENTS_CHECKS=1
  #   python -c "from ultralytics import YOLO; from uav_yolo.vision.onnx_backend import
  #       export_input_size as s; YOLO('weights/toycar.pt').export(format='onnx',
  #       imgsz=list(s((1080,1920), 960)), dynamic=False, simplify=True, opset=20)"
  #   ⚠ 尺寸一定要用 export_input_size 算（短邊補到 stride 32 的倍數，
  #     1920x1080@960 = 544x960，不是 576x960）。手算錯了框會偏約 10px，
  #     畫面看起來完全正常，只有跟 .pt 對拍才驗得出來。
  # imgsz 在匯出時就固定（DirectML 對 dynamic shape 會變慢），之後改設定無效，
  # 系統會在設定頁明講「未套用」而不是默默忽略。
  weights: weights/best.pt   # 不存在時自動退 yolo26n.pt（COCO 預訓練）
  class_names: [Car, Truck]  # 允許鎖定的類別（依權重的類別名）
  conf: 0.55
  imgsz: 640                 # 僅 .pt 有效；必須對齊模型訓練時的 imgsz，
                             # 放大不會更準只會更慢（實測 1280 比 640 又慢又差）
  lock_mode: auto       # auto=最大目標連續N幀自動鎖定 | manual=UI點選才鎖定
  min_lock_frames: 6    # 連續看到幾幀才允許鎖定（承襲原系統規格）

  # 切塊推論：目標太小而整幀推論看不到時用。把畫面切成數塊各自推論，
  # 每塊縮放比例小得多，目標相對網路輸入就變大。
  # 實測（weights/toycar.onnx，輸入 960x544，縮小訓練影像模擬飛更高）：
  #   等效 4m 高（目標 49px）  整幀 70%  → 切塊 100%
  #   等效 8m 高（目標 24px）  整幀  0%  → 切塊 100%（4x4 格）
  #   off  = 只跑整幀（最快；目標夠大時用這個）
  #   auto = 上一幀目標寬 < 6% 畫面（或什麼都沒偵測到）才切塊 ← 建議
  #   on   = 每幀都切塊
  # ⚠ 一定要加引號：YAML 1.1 會把裸的 off/on 讀成布林 False/True，
  #   跟字串比對永遠不相等 → 切塊靜默不啟動。程式端也有正規化保護。
  tiling: "off"
  # ⚠ 格數留 0 = auto，由模型輸入尺寸推算「塊不會被縮小」的最小格數。
  #   塊若比模型輸入大，前處理會把它縮小 —— 切了反而更糟。實測 8m 等效：
  #     3x2（塊 768x648，縮放 0.84）  10%   ← 寫死格數踩到的坑
  #     3x3（塊 768x432，縮放 1.25）  80%   ← auto 推出來的
  #     4x3（塊 576x432，縮放 1.26）  90%
  #     4x4（塊 576x324，縮放 1.67） 100%   4.7 Hz
  #   目標越小就把格數往上加，代價是推論次數等比增加。
  tile_cols: 0
  tile_rows: 0
  tile_overlap: 0.2     # 相鄰塊重疊比例；剛好落在切線上的目標靠它救

estimator:
  accel_std: 3.0        # 目標機動強度 m/s^2（過程噪聲）
  meas_std: 8.0         # 測地量測噪聲 m
  gate_sigma: 4.0       # innovation 閘門（幾個標準差外的量測丟棄，取代舊的25m跳變門檻）
  coast_timeout_s: 8.0  # 丟失後用速度外推(coast)的最長時間，超過進 LOST

guidance:
  enabled: false        # 安全預設：不發導引指令。要追蹤時在 UI 儀表板明確打開
  rate_hz: 1.0          # 指令頻率上限（承襲原系統「別每幀都發」規格）
  # 乾跑模式：偵測→測地→KF→導引→閘門整條鏈照跑，指令也照算照記錄，
  # **但完全不送給飛機**（連雲台 ROI 也不送）。用真實影像與真實遙測驗證
  # 「系統會下什麼指令」而零風險——固定翼首次驗證、或想先觀察時用。
  # 開著時儀表板會有明顯標示，指令列表每筆也會標「未送出」。
  dry_run: false
  multirotor:
    follow_alt_m: 40.0    # 跟隨高度（相對 home）
    standoff_m: 15.0      # 水平退距（0=正上方）
    reposition_deadband_m: 3.0   # 目標點移動超過此距離才重發
    # 指令地速上限（m/s）。0 = 交給飛控的 MPC_XY_CRUISE。
    # 為什麼要限：低空做幾公尺的小修正時，飛控預設會衝到約 3m/s、傾角約 17 度，
    # **而機身一傾斜就把相機視軸甩開，相機幾何正是目標座標的來源**——所以這是
    # 精度問題不是舒適度問題。
    # 實際送出的值＝目標速度×speed_margin＋speed_floor_ms，再夾到此上限：
    # 目標靜止就慢慢修（相機穩），目標跑起來才放行（追得上）。
    # 2026-08-04 實飛回饋「飛太快」：當時上限 5.0／margin 1.5／floor 1.0，
    # 對 1.6m/s 的玩具車下達到 3.3m/s。低空追小目標已改保守。
    max_speed_ms: 2.0
    speed_margin: 1.2       # 指令速度＝目標速度的幾倍
    speed_floor_ms: 0.5     # 目標靜止時的最低移動速度
  fixedwing:
    orbit_radius_m: 150.0 # standoff 繞行半徑（須大於最小轉彎半徑）
    orbit_dir: cw         # cw | ccw
    lead_time_s: 3.0      # 圓心用 KF 預測位置往前推的秒數
    alt_m: 80.0           # 繞行高度（相對 home）
    reposition_deadband_m: 10.0

safety:
  link_timeout_s: 2.0        # 數傳超時停止發送（承襲原系統）
  allowed_modes: ["AUTO.LOITER"]  # 只有載具在這些 PX4 模式才發導引指令；
                                  # 飛行員撥桿切出去=接管，立即閂鎖停發，需在 UI 重新啟用
  max_cmd_distance_m: 500.0  # 指令點離 home 的最大距離（圍欄）
  # 高度上下限（相對 home）。以下為共用預設，可被 safety.<載體> 覆蓋。
  # ⚠ 導引高度低於下限會被「夾」到下限——設定頁填 4m、下限 20m，飛機會飛 20m。
  #    系統會在儀表板與儲存訊息明講被夾了，但別讓自己踩到。
  min_cmd_alt_m: 20.0
  max_cmd_alt_m: 120.0
  # 載體專屬覆蓋：兩種載體不可能共用同一個高度下限——固定翼低於安全高度
  # 就是墜機，旋翼在 4m 懸停卻是再正常不過的測試。共用一個值的下場是
  # 「為了旋翼調鬆，忘了調回來就飛固定翼」。
  multirotor:
    min_cmd_alt_m: 3.0       # 旋翼可低空跟隨；別設 0，留一點地面餘裕
  fixedwing:
    min_cmd_alt_m: 20.0      # 固定翼要有迴旋與失速餘裕
  max_meas_jump_m: 30.0      # 單幀測地跳變硬上限（KF gate 之外的最後防線）
  # 以下對應機上 global_goto_node 的同名 gate；direct 模式（不經 companion）時
  # 由地面端把關，資料來自 MAVLink GPS_RAW_INT / EXTENDED_SYS_STATE。
  require_gps_quality: true
  gps_min_fix_type: 3        # 3=3D fix
  gps_min_satellites: 8
  gps_max_eph_m: 5.0   # 公尺精度（來自 MAVLink 2 h_acc；PX4 有發）
  gps_max_epv_m: 8.0
  gps_max_hdop: 2.5    # 老韌體沒 h_acc 時退回 DOP 門檻（GPS_RAW_INT.eph=HDOP×100）
  gps_max_vdop: 3.5
  require_airborne: true     # 未離地不發導引指令（本系統不負責起飛）

mavlink:
  port: COM3            # 遙測（姿態/位置/雲台）來源數傳電台 COM 埠
  baud: 57600
  gcs_system_id: 255
  # 跟飛控要的訊息頻率（Hz）；低頻寬數傳夠用的保守值
  stream_rates:
    ATTITUDE: 10
    GLOBAL_POSITION_INT: 5
    GIMBAL_DEVICE_ATTITUDE_STATUS: 5
    GPS_RAW_INT: 2              # GPS 品質閘門用
    EXTENDED_SYS_STATE: 1       # 離地判定用
    DISTANCE_SENSOR: 5          # 測距儀（光流模組多半附帶）；測地的離地高度來源

link:
  # 指令後端：決定「算出的目標 GPS」用什麼方式送出去
  #  direct = UAV_yolo 直接對 PX4 發 MAVLink DO_REPOSITION（上面 mavlink.port 同一條電台
  #           既讀遙測又發指令）。四軸首次驗證、無機上 companion 時最簡單。
  #  lr24   = 整合 NYCU_UAV_offboard：目標經 LR24-F 送 $CMD,seq,GOTO 給機上 companion 的
  #           global_goto_node，由它套安全 gate 再 DO_REPOSITION。此時 mavlink.port 這條
  #           MAVLink(SiK) 電台只負責「讀 pose」（LR24 不回傳姿態/位置），雲台 ROI 也走它。
  command_backend: direct
  lr24_port: COM4              # lr24 模式：地面端 LR24-F 的 COM 埠（與 mavlink.port 不同條）
  lr24_baud: 115200
  goto_altitude_ref: rel_home  # rel_home=送 GOTO（相對 home，須落在節點 30~120m）| amsl=送 GOTO_AMSL
  lr24_response_timeout_s: 8.0 # 等 ACK/ERR 逾時（對齊 node 7s service timeout）

sim:
  # 模擬模式參數（system.mode: sim 時生效）
  home: { lat: 24.569890, lon: 120.841928 }
  target_speed_ms: 10.0     # 模擬地面車速
  patrol: true              # true=巡邏(驅→停→轉向→續行，永不停)讓示範一直有動態；測試會設 false
  patrol_leg_s: 18.0        # 每段行駛秒數
  patrol_hold_s: 6.0        # 每段結尾短停秒數（順便示範急停收斂）
  stop_after_s: 25.0        # patrol=false 時：幾秒後永久急停（測試用）
  detection_dropout: [[12.0, 15.0]]  # 模擬盲區（幾秒~幾秒偵測不到）
  pixel_noise_px: 2.0
